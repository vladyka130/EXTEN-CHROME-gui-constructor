<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Налаштування демо</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; background: #10151d; color: #e6edf7; margin: 0; padding: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .row { margin-bottom: 10px; }
  label { display: block; color: #91a4bf; font-size: 11px; text-transform: uppercase; }
</style>
</head>
<body>
  <h2>Налаштування</h2>
  <div class="row">
    <label for="interval">Інтервал оновлення, с</label>
    <input id="interval" type="number" value="30">
  </div>
  <div class="row">
    <label class="check"><input type="checkbox" id="autoscroll" checked> Автопрокрутка журналу</label>
  </div>
  <button id="save">Зберегти</button>
</body>
</html>
